
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project files
        run: |
          test -f pubspec.yaml || (echo "pubspec.yaml missing from repository root" && exit 1)
          test -d lib || (echo "lib folder missing" && exit 1)
          test -d android || (echo "android folder missing" && exit 1)

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kid-Balloon-Pop-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
